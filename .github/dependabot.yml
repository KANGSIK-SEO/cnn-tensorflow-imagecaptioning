# 의존성 자동 점검: 학습용 라이브러리(TensorFlow.js 등)·GitHub Actions에 새 버전(보안 패치 포함)이 나오면 매주 PR을 연다.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/training"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
